<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="piercer" />
  <title>Piercer Batch File Renamer</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Piercer Batch File Renamer</h1>
      <p class="subtitle">Renomeador em lote com preview em tempo real, Regex, numeração e exportação de script</p>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-primary" id="btnPickDir">Abrir Pasta (Direto)</button>
      <label class="btn btn-ghost">Selecionar Arquivos<input type="file" id="fileInput" multiple hidden /></label>
    </div>
  </header>

  <main class="layout">
    <aside class="card controls">
      <h2>Regras de Renomeação</h2>
      <div class="field">
        <label for="findStr">Localizar (Texto ou Regex)</label>
        <input type="text" id="findStr" placeholder="Ex: IMG_ ou \s+" />
      </div>
      <div class="field">
        <label for="replaceStr">Substituir por</label>
        <input type="text" id="replaceStr" placeholder="Ex: foto_ ou -" />
      </div>
      <label class="check"><input type="checkbox" id="useRegex" /> Usar Regex (expressão regular)</label>
      <label class="check"><input type="checkbox" id="removeAccents" /> Remover acentos</label>

      <div class="row-2" style="margin-top:10px;">
        <div class="field"><label for="prefix">Prefixo</label><input type="text" id="prefix" placeholder="2026_" /></div>
        <div class="field"><label for="suffix">Sufixo (antes da ext.)</label><input type="text" id="suffix" placeholder="_final" /></div>
      </div>

      <div class="field">
        <label for="caseMode">Conversão de Case</label>
        <select id="caseMode">
          <option value="none">Manter original</option>
          <option value="lower">lowercase</option>
          <option value="upper">UPPERCASE</option>
          <option value="snake">snake_case</option>
          <option value="kebab">kebab-case</option>
        </select>
      </div>

      <div class="row-2">
        <div class="field">
          <label for="seqMode">Numeração Sequencial</label>
          <select id="seqMode">
            <option value="none">Sem numeração</option>
            <option value="prefix">Início (001_nome)</option>
            <option value="suffix">Fim (nome_001)</option>
          </select>
        </div>
        <div class="field"><label for="seqStart">Número Inicial</label><input type="number" id="seqStart" value="1" min="0" /></div>
      </div>

      <div class="btn-col">
        <button type="button" class="btn btn-primary" id="btnApplyDirect" disabled>Aplicar na Pasta Aberta</button>
        <button type="button" class="btn btn-ghost" id="btnExportPs1">Baixar Script PowerShell (.ps1)</button>
        <button type="button" class="btn btn-ghost" id="btnExportSh">Baixar Script Bash (.sh)</button>
      </div>
    </aside>

    <section class="card preview-card">
      <div class="preview-head">
        <h2>Preview Antes / Depois</h2>
        <span class="subtitle" id="countLabel">0 arquivos carregados</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nome Original</th><th>Novo Nome</th><th>Status</th></tr></thead>
          <tbody id="previewBody">
            <tr><td colspan="3" class="empty">Selecione uma pasta ou arquivos para visualizar as alterações.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
  <script src='../piercer_i18n.js'></script>
</body>
</html>
